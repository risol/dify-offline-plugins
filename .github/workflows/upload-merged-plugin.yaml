name: Build Offline Dify Plugins

on:
  workflow_dispatch:
    inputs:
      plugin_path:
        description: "Plugin directory, for example models/openai"
        required: true
        type: string
      python_platform:
        description: "Target Python wheel platform"
        required: true
        default: manylinux2014_x86_64
        type: choice
        options:
          - manylinux2014_x86_64
          - manylinux2014_aarch64
      allow_prerelease:
        description: "Allow prerelease dependencies during resolution"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "agent-strategies/**"
      - "datasources/**"
      - "extensions/**"
      - "models/**"
      - "tools/**"
      - "triggers/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-plugins:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect requested or changed plugins
        id: detect
        env:
          MANUAL_PLUGIN_PATH: ${{ inputs.plugin_path }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${MANUAL_PLUGIN_PATH:-}" ]]; then
            if [[ ! -f "$MANUAL_PLUGIN_PATH/manifest.yaml" ]]; then
              echo "Plugin manifest not found: $MANUAL_PLUGIN_PATH/manifest.yaml" >&2
              exit 1
            fi
            printf 'plugins=["%s"]\n' "$MANUAL_PLUGIN_PATH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.before }}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$GITHUB_SHA" -- \
            agent-strategies datasources extensions models tools triggers)

          declare -A plugin_paths=()
          for changed_file in "${changed_files[@]}"; do
            candidate="${changed_file}"
            while [[ "$candidate" == */* ]]; do
              candidate="${candidate%/*}"
              if [[ -f "$candidate/manifest.yaml" ]]; then
                plugin_paths["$candidate"]=1
                break
              fi
            done
          done

          if [[ ${#plugin_paths[@]} -eq 0 ]]; then
            echo 'plugins=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${!plugin_paths[@]}" | sort | \
            python3 -c 'import json, sys; print("plugins=" + json.dumps([x.strip() for x in sys.stdin if x.strip()]))' \
            >> "$GITHUB_OUTPUT"

  package-offline:
    needs: detect-plugins
    if: needs.detect-plugins.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin_path: ${{ fromJson(needs.detect-plugins.outputs.plugins) }}
    steps:
      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set target platform variables
        id: target
        shell: bash
        env:
          INPUT_PLATFORM: ${{ inputs.python_platform }}
        run: |
          set -euo pipefail
          platform="${INPUT_PLATFORM:-manylinux2014_x86_64}"
          case "$platform" in
            manylinux2014_x86_64) suffix="offline-linux-amd64" ;;
            manylinux2014_aarch64) suffix="offline-linux-arm64" ;;
            *) echo "Unsupported platform: $platform" >&2; exit 1 ;;
          esac
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          activate-environment: false
          enable-cache: true
          cache-dependency-glob: |
            ${{ matrix.plugin_path }}/uv.lock
            ${{ matrix.plugin_path }}/requirements.txt

      - name: Download Dify plugin CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          cli_tag="$(gh release view -R langgenius/dify-plugin-daemon --json tagName --jq '.tagName')"
          gh release download "$cli_tag" -R langgenius/dify-plugin-daemon \
            --pattern dify-plugin-linux-amd64 --dir .tools
          chmod +x .tools/dify-plugin-linux-amd64
          mv .tools/dify-plugin-linux-amd64 .tools/dify

      - name: Download offline repackaging tool
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/risol/dify-plugin-repackaging.git .repackaging
          git -C .repackaging fetch --depth 1 origin 3ed1ddce2c3963adc32e2788c3e584a58d45bdeb
          git -C .repackaging checkout --detach 3ed1ddce2c3963adc32e2788c3e584a58d45bdeb
          chmod +x .repackaging/plugin_repackaging.sh .repackaging/dify-plugin-linux-amd64

      - name: Validate plugin dependencies
        shell: bash
        run: |
          set -euo pipefail
          plugin_path="${{ matrix.plugin_path }}"
          if [[ -f "$plugin_path/uv.lock" ]]; then
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/plugin-venv" \
              uv sync --project "$plugin_path" --all-groups --frozen --python 3.12
          elif [[ -f "$plugin_path/requirements.txt" ]]; then
            uv venv "$RUNNER_TEMP/plugin-venv" --python 3.12
            uv pip install --python "$RUNNER_TEMP/plugin-venv/bin/python" \
              -r "$plugin_path/requirements.txt"
          elif [[ -f "$plugin_path/pyproject.toml" ]]; then
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/plugin-venv" \
              uv sync --project "$plugin_path" --all-groups --python 3.12
          else
            echo "No dependency manifest found in $plugin_path" >&2
            exit 1
          fi

      - name: Generate package requirements
        shell: bash
        run: bash .github/scripts/export-legacy-requirements.sh "${{ matrix.plugin_path }}"

      - name: Build base difypkg
        id: base-package
        shell: bash
        run: |
          set -euo pipefail
          plugin_path="${{ matrix.plugin_path }}"
          safe_path="${plugin_path//\//-}"
          raw_package="$RUNNER_TEMP/${safe_path}.difypkg"
          .tools/dify plugin package "$plugin_path" --output_path "$raw_package"
          echo "raw_package=$raw_package" >> "$GITHUB_OUTPUT"

      - name: Repackage with bundled wheels
        id: offline-package
        shell: bash
        env:
          RAW_PACKAGE: ${{ steps.base-package.outputs.raw_package }}
          TARGET_PLATFORM: ${{ steps.target.outputs.platform }}
          PACKAGE_SUFFIX: ${{ steps.target.outputs.suffix }}
        run: |
          set -euo pipefail
          package_file="$(basename "$RAW_PACKAGE")"
          package_base="${package_file%.difypkg}"
          cp "$RAW_PACKAGE" ".repackaging/$package_file"
          extra_args=()
          if [[ "${{ inputs.allow_prerelease }}" == "true" ]]; then
            extra_args+=("-R")
          fi
          (
            cd .repackaging
            ./plugin_repackaging.sh -p "$TARGET_PLATFORM" -s "$PACKAGE_SUFFIX" \
              "${extra_args[@]}" local "./$package_file"
          )
          output=".repackaging/${package_base}-${PACKAGE_SUFFIX}.difypkg"
          test -s "$output"
          mkdir -p dist
          mv "$output" "dist/$(basename "$output")"
          echo "package=dist/$(basename "$output")" >> "$GITHUB_OUTPUT"
          echo "package_name=$(basename "$output")" >> "$GITHUB_OUTPUT"

      - name: Publish package to GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.offline-package.outputs.package }}
          PACKAGE_NAME: ${{ steps.offline-package.outputs.package_name }}
          PACKAGE_SUFFIX: ${{ steps.target.outputs.suffix }}
          PLUGIN_PATH: ${{ matrix.plugin_path }}
        shell: bash
        run: |
          set -euo pipefail
          plugin_author="$(awk -F': *' '/^author:/ {gsub(/["\047]/, "", $2); print $2; exit}' "$PLUGIN_PATH/manifest.yaml")"
          plugin_name="$(awk -F': *' '/^name:/ {gsub(/["\047]/, "", $2); print $2; exit}' "$PLUGIN_PATH/manifest.yaml")"
          plugin_version="$(awk -F': *' '/^version:/ {gsub(/["\047]/, "", $2); print $2; exit}' "$PLUGIN_PATH/manifest.yaml")"
          : "${plugin_author:?author is missing from manifest.yaml}" \
            "${plugin_name:?name is missing from manifest.yaml}" \
            "${plugin_version:?version is missing from manifest.yaml}"

          tag="${plugin_author}-${plugin_name}-v${plugin_version}-${PACKAGE_SUFFIX}"
          title="${plugin_author}/${plugin_name} ${plugin_version} (${PACKAGE_SUFFIX})"
          notes="Self-contained offline Dify plugin package.\n\n- Plugin: ${plugin_author}/${plugin_name}\n- Version: ${plugin_version}\n- Target: ${PACKAGE_SUFFIX}\n- Source commit: ${GITHUB_SHA}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$PACKAGE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest=false
          fi

          release_url="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$release_url" >> "$GITHUB_OUTPUT"
          echo "Published $PACKAGE_NAME to $release_url"

      - name: Write summary
        shell: bash
        env:
          PACKAGE: ${{ steps.offline-package.outputs.package }}
        run: |
          {
            echo "## Offline Dify plugin package"
            echo
            echo "- Plugin: \`${{ matrix.plugin_path }}\`"
            echo "- Target: \`${{ steps.target.outputs.platform }}\`"
            echo "- Package: \`$PACKAGE\`"
            echo "- Release: [${{ steps.release.outputs.tag }}](${{ steps.release.outputs.url }})"
            echo "- Dependencies: bundled as wheels"
          } >> "$GITHUB_STEP_SUMMARY"
